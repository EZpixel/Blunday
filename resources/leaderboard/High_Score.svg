<!-- Blunday leaderboard icon: "High Score". 512x512, in the achievement icons'
     shared look (see resources/achievements): night-sky ground, ink (#0d1640)
     ringed disc lit from the top left, Blunday drawn in the game's own
     proportions. Blunday stands crowned on the gold step of a podium, silver
     and bronze on either side. High_Score.png next to it is the 512x512 render
     uploaded to Play Console (made with @resvg/resvg-js, like the achievement
     icons; it isn't part of `npm run icons`). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a0a3c"/><stop offset="1" stop-color="#2a4a7a"/></linearGradient>
    <radialGradient id="disc" cx="0.38" cy="0.32" r="0.75"><stop offset="0" stop-color="#ff9a9a"/><stop offset="1" stop-color="#9a1830"/></radialGradient>
    <radialGradient id="gloss" cx="0.35" cy="0.2" r="0.6"><stop offset="0" stop-color="#fff" stop-opacity="0.35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="body-blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#66aaff"/><stop offset="1" stop-color="#2255bb"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#c08a10"/></linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2f5fa"/><stop offset="1" stop-color="#8a93a6"/></linearGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4c08e"/><stop offset="1" stop-color="#a0581e"/></linearGradient>
    <clipPath id="discClip"><circle cx="256" cy="256" r="200"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.35"/></filter>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <g fill="#fff"><circle cx="40" cy="44" r="10" opacity="0.12"/><circle cx="476" cy="70" r="6" opacity="0.14"/><circle cx="466" cy="462" r="12" opacity="0.08"/><circle cx="34" cy="470" r="6" opacity="0.12"/></g>
  <circle cx="256" cy="256" r="214" fill="#0d1640"/>
  <circle cx="256" cy="256" r="200" fill="url(#disc)"/>
  <g clip-path="url(#discClip)">
    <path d="M256 256L556 256L550.24 314.53ZM256 256L533.16 370.81L505.44 422.67ZM256 256L468.13 468.13L422.67 505.44ZM256 256L370.81 533.16L314.53 550.24ZM256 256L256 556L197.47 550.24ZM256 256L141.19 533.16L89.33 505.44ZM256 256L43.87 468.13L6.56 422.67ZM256 256L-21.16 370.81L-38.24 314.53ZM256 256L-44 256L-38.24 197.47ZM256 256L-21.16 141.19L6.56 89.33ZM256 256L43.87 43.87L89.33 6.56ZM256 256L141.19 -21.16L197.47 -38.24ZM256 256L256 -44L314.53 -38.24ZM256 256L370.81 -21.16L422.67 6.56ZM256 256L468.13 43.87L505.44 89.33ZM256 256L533.16 141.19L550.24 197.47Z" fill="#fff" opacity="0.14"/>
    <!-- Podium: silver (left), bronze (right), gold (middle, tallest) -->
    <rect x="90" y="330" width="116" height="190" rx="10" fill="url(#silver)" stroke="#0d1640" stroke-width="10"/>
    <rect x="90" y="330" width="116" height="20" rx="10" fill="#fff" opacity="0.35"/>
    <rect x="306" y="352" width="116" height="190" rx="10" fill="url(#bronze)" stroke="#0d1640" stroke-width="10"/>
    <rect x="306" y="352" width="116" height="20" rx="10" fill="#fff" opacity="0.3"/>
    <rect x="186" y="290" width="140" height="230" rx="10" fill="url(#gold)" stroke="#0d1640" stroke-width="10"/>
    <rect x="186" y="290" width="140" height="22" rx="10" fill="#fff" opacity="0.35"/>
    <rect x="292" y="300" width="24" height="220" fill="#8a5a08" opacity="0.35"/>
    <polygon points="256,330 265.4,350.1 287.4,352.7 271.2,367.8 275.5,389.5 256,378.6 236.5,389.5 240.8,367.8 224.6,352.7 246.6,350.1" fill="#fff6c8" stroke="#0d1640" stroke-width="6" stroke-linejoin="round"/>
    <circle cx="256" cy="256" r="200" fill="url(#gloss)"/>
  </g>
  <circle cx="256" cy="256" r="191" fill="none" stroke="#fff" stroke-width="5" opacity="0.22"/>
  <g filter="url(#shadow)">
    <!-- Blunday (40x44 units at 3.3x), feet on the gold step -->
    <g transform="translate(190 145) scale(3.3)">
      <rect x="4" y="38" width="10" height="6" rx="1" fill="#2255bb" stroke="#0d1640" stroke-width="3"/>
      <rect x="26" y="38" width="10" height="6" rx="1" fill="#2255bb" stroke="#0d1640" stroke-width="3"/>
      <rect x="0" y="0" width="40" height="40" rx="6" fill="url(#body-blue)" stroke="#0d1640" stroke-width="3"/>
      <rect x="4" y="2.5" width="26" height="3" rx="1.5" fill="#fff" opacity="0.3"/>
      <rect x="3" y="35" width="34" height="3" rx="1.5" fill="#000" opacity="0.12"/>
      <!-- Happy closed eyes and a big grin -->
      <path d="M8.5 15Q12.5 10 16.5 15" fill="none" stroke="#111" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M23.5 15Q27.5 10 31.5 15" fill="none" stroke="#111" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M12 22H28Q27 31 20 31Q13 31 12 22Z" fill="#5a1020" stroke="#334" stroke-width="2" stroke-linejoin="round"/>
      <path d="M15.5 28.5Q20 26 24.5 28.5Q22.5 31 20 31Q17.5 31 15.5 28.5Z" fill="#ff7a90"/>
      <circle cx="7" cy="21" r="2.6" fill="#ff7a9a" opacity="0.55"/>
      <circle cx="33" cy="21" r="2.6" fill="#ff7a9a" opacity="0.55"/>
      <!-- Crown, a little tilted -->
      <g transform="rotate(-8 20 -2)">
        <path d="M8 1L9 -10L14.5 -4.5L20 -13L25.5 -4.5L31 -10L32 1Z" fill="url(#gold)" stroke="#0d1640" stroke-width="2.2" stroke-linejoin="round"/>
        <circle cx="20" cy="-3" r="2" fill="#e8304a" stroke="#0d1640" stroke-width="1.2"/>
        <circle cx="12.5" cy="-1.5" r="1.3" fill="#4ab0ff"/>
        <circle cx="27.5" cy="-1.5" r="1.3" fill="#4ab0ff"/>
      </g>
    </g>
    <path d="M128 196Q128 216 148 216Q128 216 128 236Q128 216 108 216Q128 216 128 196Z" fill="#fff"/>
    <path d="M394 150Q394 172 416 172Q394 172 394 194Q394 172 372 172Q394 172 394 150Z" fill="#fff"/>
    <path d="M404 266Q404 278 416 278Q404 278 404 290Q404 278 392 278Q404 278 404 266Z" fill="#fff"/>
  </g>
</svg>
