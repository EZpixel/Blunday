<!-- Blunday achievement icon: "Gem of My Eye". 512x512, full bleed; everything
     that matters stays inside the central badge circle (r 200, ~80% of the width).
     Shared look across all 17: night-sky ground, ink (#0d1640) ringed disc lit
     from the top left, Blunday drawn in the game's own proportions. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a0a3c"/><stop offset="1" stop-color="#2a4a7a"/></linearGradient>
    <radialGradient id="disc" cx="0.38" cy="0.32" r="0.75"><stop offset="0" stop-color="#b4f5c8"/><stop offset="1" stop-color="#2a9a5a"/></radialGradient>
    <radialGradient id="gloss" cx="0.35" cy="0.2" r="0.6"><stop offset="0" stop-color="#fff" stop-opacity="0.35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="body-blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#66aaff"/><stop offset="1" stop-color="#2255bb"/></linearGradient>
    <linearGradient id="body-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#c08a10"/></linearGradient>
    <linearGradient id="body-grey" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#bcc2cc"/><stop offset="1" stop-color="#5c636e"/></linearGradient>
    <linearGradient id="body-green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#86e682"/><stop offset="1" stop-color="#2e8a34"/></linearGradient>
    <linearGradient id="body-orange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb057"/><stop offset="1" stop-color="#d0520f"/></linearGradient>
    <linearGradient id="body-white" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#bfc6d6"/></linearGradient>
    <clipPath id="discClip"><circle cx="256" cy="256" r="200"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.35"/></filter>
    <radialGradient id="glowY"><stop offset="0" stop-color="#fff6a0" stop-opacity="0.9"/><stop offset="1" stop-color="#fff6a0" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowR"><stop offset="0" stop-color="#ff6688" stop-opacity="0.7"/><stop offset="1" stop-color="#ff6688" stop-opacity="0"/></radialGradient>
    
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <g fill="#fff"><circle cx="40" cy="44" r="10" opacity="0.12"/><circle cx="476" cy="70" r="6" opacity="0.14"/><circle cx="466" cy="462" r="12" opacity="0.08"/><circle cx="34" cy="470" r="6" opacity="0.12"/></g>
  <circle cx="256" cy="256" r="214" fill="#0d1640"/>
  <circle cx="256" cy="256" r="200" fill="url(#disc)"/>
  <g clip-path="url(#discClip)">
    <circle cx="360" cy="196" r="120" fill="url(#glowR)"/>
    <circle cx="256" cy="256" r="200" fill="url(#gloss)"/>
  </g>
  <circle cx="256" cy="256" r="191" fill="none" stroke="#fff" stroke-width="5" opacity="0.22"/>
  <g filter="url(#shadow)">
    <g transform="translate(206 300) rotate(8) scale(3.9) translate(-20 -20)"><rect x="4" y="38" width="10" height="6" rx="1" fill="#2255bb" stroke="#0d1640" stroke-width="2.5641025641025643"/><rect x="26" y="38" width="10" height="6" rx="1" fill="#2255bb" stroke="#0d1640" stroke-width="2.5641025641025643"/><rect x="0" y="0" width="40" height="40" rx="6" fill="url(#body-blue)" stroke="#0d1640" stroke-width="2.5641025641025643"/><rect x="4" y="2.5" width="26" height="3" rx="1.5" fill="#fff" opacity="0.3"/><rect x="3" y="35" width="34" height="3" rx="1.5" fill="#000" opacity="0.12"/><path d="M12.5 19.68C4.18 14.48 9.38 8.5 12.5 12.92C15.62 8.5 20.82 14.48 12.5 19.68Z" fill="#ff3d6e" stroke="#0d1640" stroke-width="1.153846153846154" stroke-linejoin="round"/><circle cx="10.3" cy="13.3" r="1.1" fill="#fff"/><path d="M27.5 19.68C19.18 14.48 24.38 8.5 27.5 12.92C30.62 8.5 35.82 14.48 27.5 19.68Z" fill="#ff3d6e" stroke="#0d1640" stroke-width="1.153846153846154" stroke-linejoin="round"/><circle cx="25.3" cy="13.3" r="1.1" fill="#fff"/><path d="M13 23L27 23A7 7 0 0 1 13 23Z" fill="#334"/><ellipse cx="20" cy="27" rx="3.6" ry="1.8" fill="#ff7a8a"/><ellipse cx="6.5" cy="22" rx="3.2" ry="1.8" fill="#ff6e8c" opacity="0.6"/><ellipse cx="33.5" cy="22" rx="3.2" ry="1.8" fill="#ff6e8c" opacity="0.6"/></g><g transform="translate(360 196) rotate(12) scale(7.4)"><path d="M0 -8L8 -2L0 9L-8 -2Z" fill="#dd2244" stroke="#0d1640" stroke-width="1.3513513513513513" stroke-linejoin="round"/><path d="M-4 -3H4L0 -8Z" fill="#ff6688"/><path d="M-8 -2L-4 -3L0 9Z" fill="#ff88aa"/><path d="M-8 -2H8" stroke="#0d1640" stroke-width="0.6" opacity="0.5"/></g><path d="M410 112Q410 130 428 130Q410 130 410 148Q410 130 392 130Q410 130 410 112Z" fill="#fff"/><path d="M296 108Q296 120 308 120Q296 120 296 132Q296 120 284 120Q296 120 296 108Z" fill="#fff"/><path d="M420 250Q420 262 432 262Q420 262 420 274Q420 262 408 262Q420 262 420 250Z" fill="#fff"/><path d="M300 265.7C279.2 252.7 292.2 237.75 300 248.8C307.8 237