<!-- Blunday Google Play feature graphic, 1024x500. Built from the app icon layers
     (resources/icon) and the main menu title style (src/index.css .title-wrap h1, .splash). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0a3c"/>
      <stop offset="1" stop-color="#2a4a7a"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#66aaff"/>
      <stop offset="1" stop-color="#2255bb"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eca5e"/>
      <stop offset="0.3" stop-color="#3ca03c"/>
      <stop offset="1" stop-color="#1e6a1e"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6c8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff6c8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="blur12" x="-20%" y="-40%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="blur24" x="-20%" y="-40%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <!-- One platform in game units: top center at the origin, 56x12 -->
    <g id="platform">
      <rect x="-28" y="0" width="56" height="12" rx="4" fill="url(#grass)"/>
      <rect x="-25" y="1" width="50" height="3" fill="rgba(180,255,120,0.45)"/>
    </g>
    <!-- One gold coin, matching the in-game gold icon, centered at the origin -->
    <g id="coin">
      <circle r="11" fill="#b8860b"/>
      <circle r="9" fill="#ffd700"/>
      <text y="4.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#b8860b">$</text>
    </g>
  </defs>

  <!-- Night sky and bubbles -->
  <rect width="1024" height="500" fill="url(#sky)"/>
  <g fill="#fff">
    <circle cx="70"  cy="90"  r="26" opacity="0.08"/>
    <circle cx="395" cy="70"  r="14" opacity="0.10"/>
    <circle cx="520" cy="420" r="30" opacity="0.06"/>
    <circle cx="610" cy="60"  r="10" opacity="0.12"/>
    <circle cx="960" cy="400" r="22" opacity="0.08"/>
    <circle cx="40"  cy="330" r="12" opacity="0.10"/>
    <circle cx="760" cy="455" r="9"  opacity="0.12"/>
    <circle cx="470" cy="250" r="7"  opacity="0.12"/>
  </g>

  <!-- The Moon, Blunday's goal -->
  <circle cx="930" cy="88" r="95" fill="url(#moonGlow)"/>
  <circle cx="930" cy="88" r="46" fill="#f3efcf"/>
  <circle cx="914" cy="74" r="9"  fill="#dcd6ae"/>
  <circle cx="944" cy="102" r="12" fill="#dcd6ae"/>
  <circle cx="948" cy="70" r="5"  fill="#dcd6ae"/>

  <!-- Platforms climbing up toward the Moon, with gold on them -->
  <g filter="url(#shadow)">
    <use href="#platform" transform="translate(95 255) scale(1.8)"/>
    <use href="#platform" transform="translate(345 190) scale(1.6)"/>
    <use href="#platform" transform="translate(195 105) scale(1.6)"/>
    <use href="#coin" transform="translate(95 215) scale(1.7)"/>
    <use href="#coin" transform="translate(345 154) scale(1.5)"/>
    <use href="#coin" transform="translate(195 68) scale(1.5)"/>
  </g>

  <!-- Blunday on a big platform, eyes on the Moon (icon foreground, scaled up) -->
  <g transform="translate(260 380) scale(3.6)" filter="url(#shadow)">
    <use href="#platform"/>
    <rect x="-20" y="-40" width="40" height="40" rx="6" fill="url(#body)"/>
    <rect x="-12" y="-30" width="9" height="9" fill="#fff"/>
    <rect x="3" y="-30" width="9" height="9" fill="#fff"/>
    <rect x="-9.5" y="-30" width="4" height="4" fill="#111"/>
    <rect x="5.5" y="-30" width="4" height="4" fill="#111"/>
    <rect x="-7" y="-16" width="14" height="2" fill="#334"/>
    <rect x="-16" y="-2" width="10" height="6" fill="#2255bb"/>
    <rect x="6" y="-2" width="10" height="6" fill="#2255bb"/>
  </g>

  <!-- Title: the main menu style at 2.4x (outline, blue extrusion, glow) -->
  <g font-family="Arial, sans-serif" font-weight="bold" font-size="108" letter-spacing="4" text-anchor="middle">
    <text x="690" y="280" fill="#66aaff" opacity="0.55" filter="url(#blur24)">Blunday</text>
    <text x="690" y="304" fill="#000" opacity="0.7" filter="url(#blur12)">Blunday</text>
    <text x="690" y="296" fill="#0d1640" stroke="#0d1640" stroke-width="12" stroke-linejoin="round">Blunday</text>
    <text x="690" y="292" fill="#1b3a8a" stroke="#1b3a8a" stroke-width="12" stroke-linejoin="round">Blunday</text>
    <text x="690" y="288" fill="#2a5fc0" stroke="#2a5fc0" stroke-width="12" stroke-linejoin="round">Blunday</text>
    <text x="690" y="280" fill="#fff" stroke="#0d1640" stroke-width="12" stroke-linejoin="round" paint-order="stroke">Blunday</text>
  </g>

  <!-- Splash text, tilted like the menu splash -->
  <g transform="translate(815 338) rotate(-10)" font-family="Arial, sans-serif" font-weight="bold" font-size="28" text-anchor="middle">
    <text x="5" y="7" fill="#0d1640" stroke="#0d1640" stroke-width="6" stroke-linejoin="round">Get Rich or Fall Trying!</text>
    <text x="0" y="0" fill="#ffe08a" stroke="#0d1640" stroke-width="6" stroke-linejoin="round" paint-order="stroke">Get Rich or Fall Trying!</text>
  </g>
</svg>
